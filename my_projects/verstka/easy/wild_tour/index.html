<!DOCTYPE html>
<html lang = "en">
<head>

    <meta name    = "description" content = "Сайт про путешествия"/>

</head>
<body>
    <header class = "header">
    <img    class = "logo" src                                     = 'images/logo.png' loading = "lazy" alt = "logo">

        </div>
        
      </header>
      <main class = "main">
      <p    class = "subtitle">C 2021 года и по ...</p>
        
        <div>

         <div    class = "flex__container">
           
            <video src   = "video/1.mp4" controls poster = "images/main_img1.png" class = "video"></video>
            <img   class = 'img' src                     = "/images/main_img2.png" alt  = "Перекресток">
          </div>

          <div class = "slider__wrapper">
          <div class = "slides">
          <img class = "slide" src = "images/slide1.png" alt = "Изображение слайда">
            </div>
            <div  class = "buttons">
            <svg  class = "left__btn" width                                                     = "9" height = "13" viewBox = "0 0 9 13" fill = "none" xmlns = "http://www.w3.org/2000/svg">
            <path d     = "M-2.84124e-07 6.5L8.25 0.870836L8.25 12.1292L-2.84124e-07 6.5Z" fill = "white"/>
                </svg>
                
              
              
              <div   class = "radio-container">
              <label class = "radio-label">
                <input
                  class = "radio"
                  type  = "radio"
                  name  = "slider__radio"
                  value = "1"
                  id    = "slide1__btn"
                  checked     
                >
                <span class = "radio-title"></span>
              </label>
              <label class = "radio-label">
                <input
                  class = "radio"
                  type  = "radio"
                  name  = "slider__radio"
                  value = "2"
                  id    = "slide2__btn"
                >
                <span class = "radio-title"></span>
              </label>
              <label class = "radio-label">
                <input
                  class = "radio"
                  type  = "radio"
                  name  = "slider__radio"
                  value = "3"
                  id    = "slide3__btn"
                >
                <span class = "radio-title"></span>
              </label>
                <label class = "radio-label">
                <input
                  class = "radio"
                  type  = "radio"
                  name  = "slider__radio"
                  value = "4"
                  id    = "slide4__btn"
                >
                <span class = "radio-title"></span>
              </label>
                <label class = "radio-label">
                <input
                  class = "radio"
                  type  = "radio"
                  name  = "slider__radio"
                  value = "5"
                  id    = "slide5__btn"
                >
                <span class = "radio-title"></span>
              </label>
            </div>
           <svg  class = "right__btn" width                                  = "9" height = "13" viewBox = "0 0 9 13" fill = "none" xmlns = "http://www.w3.org/2000/svg">
           <path d     = "M9 6.5L0.75 0.870836L0.749999 12.1292L9 6.5Z" fill = "#305A2E"/>
              </svg>
              

          

            </div>
          </div>
          
        </div>

      <footer class = "footer">
      <p      class = "footer_text">Социальные сети</p>
      <div    class = "social">
      <a      href  = "#">
      <img    class = "rutube" src = 'images/rutube 1.png' loading = "lazy" alt = "rutube">
          </a>
          <a   href  = "#">
          <img class = "vk" src = 'images/vk (4).png' loading = "lazy" alt = "vk">
          </a>
          <a   href  = "#">
          <img class = "telegram" src = 'images/telegram (4).png' loading = "lazy" alt = "telegram">
          </a>
          
        </div>
</body>
